    <rect x="24" y="22" width="2" height="2"/><rect x="28" y="18" width="2" height="2"/>
    <rect x="32" y="16" width="2" height="2"/><rect x="34" y="20" width="2" height="2"/>
    <rect x="14" y="24" width="2" height="2"/><rect x="18" y="26" width="2" height="2"/>
    <rect x="22" y="28" width="2" height="2"/><rect x="26" y="26" width="2" height="2"/>
