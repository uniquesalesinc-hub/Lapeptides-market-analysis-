    <rect x="4.5" y="30.5" width="5" height="5" fill="#FFFFFF"/>
    <rect x="6.2" y="32.2" width="1.6" height="1.6" fill="#2B2B2B"/>

    <!-- generic module noise, purely decorative -->
    <rect x="16" y="3" width="2" height="2"/><rect x="20" y="3" width="2" height="2"/>
    <rect x="16" y="7" width="2" height="2"/><rect x="22" y="7" width="2" height="2"/>
    <rect x="18" y="11" width="2" height="2"/><rect x="14" y="14" width="2" height="2"/>
