<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Generic "a QR code renders here" placeholder — NOT a scannable code.
       Real brands get a live, scannable QR generated automatically at build
       time from tracking.qr.destination (see scripts/lib/applyFields.js). -->
