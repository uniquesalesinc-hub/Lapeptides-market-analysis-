<?xml version="1.0" encoding="UTF-8"?>
<!--
  MASTER LABEL — canonical source (see label-spec.json for the field/element registry)
  This is a TEMPLATE, not a finished label. Every value below is a neutral
  placeholder. No real or fictional brand identity is represented here.

  Physical size: 1.77in x 0.77in (44.958mm x 19.558mm). 1 SVG user unit = 1pt
  (72 units/in), so this viewBox maps directly onto a 127.44 x 55.44pt PDF
  page with no unit conversion — landscape, no margins, no crop marks.

  Three independently themeable/fillable sections, left to right:
    BRANDING (x 0-42)  |  PRODUCT (x 42-88)  |  VERIFICATION (x 88-127.44)

  Colors/fonts/logo come from a theme JSON (see default-theme.json,
  example-brand-theme.json). Brand/product/tracking text and swappable
  graphics come from a field-map applied by element id (see label-spec.json
  -> "fields"; README.md documents the whole pipeline). This file is safe to
  open directly in Adobe Illustrator, Figma, Inkscape, or a browser.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 127.44 55.44" width="127.44pt" height="55.44pt"
     id="master-label" data-template-id="la-peptides-universal-label" data-template-version="1.0.0">

  <title>LA Peptides Universal White-Label Vial Label</title>
  <desc>Three-section (branding / product / verification), theme- and field-driven vial label template. Element ids are the integration surface — see label-spec.json.</desc>

  <defs>
    <style id="label-fonts">
      <![CDATA[
        #master-label text {
          font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
        }
        #master-label .mono {
          font-family: "Roboto Mono", "Courier New", monospace;
        }
      ]]>
    </style>

    <!--
      Icon symbols. Kept in this file (rather than referenced from the
      standalone placeholder-icons.svg) so master-label.svg renders correctly
      everywhere without depending on cross-file <use> resolution, which is
      unreliable across SVG renderers/PDF tooling. placeholder-icons.svg is
      the same set, kept as a standalone reference/import file — if you edit
      one, edit the other to match (see README.md).

      None of these shapes set their own fill/stroke color — they inherit
      from whatever the <use> element sets, so scripts/lib/applyTheme.js can
      recolor every icon by setting fill on the <use> tag.
    -->
    <symbol id="icon-purity" viewBox="0 0 24 24">
      <path d="M9 2 L15 2 L15 8.5 L19.5 18 C20.4 19.9 19 22 16.9 22 L7.1 22 C5 22 3.6 19.9 4.5 18 L9 8.5 Z"
            fill="none" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M8 15 L16 15" stroke-width="1.4"/>
      <path d="M9 2 L15 2" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-lab-tested" viewBox="0 0 24 24">
      <path d="M12 2 L12 22 M4.9 6 L19.1 18 M19.1 6 L4.9 18" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M12 2 L9.5 4.5 M12 2 L14.5 4.5 M12 22 L9.5 19.5 M12 22 L14.5 19.5" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M4.9 6 L7.9 6.6 M4.9 6 L5.5 9 M19.1 18 L16.1 17.4 M19.1 18 L18.5 15" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M19.1 6 L16.1 6.6 M19.1 6 L18.5 9 M4.9 18 L7.9 17.4 M4.9 18 L5.5 15" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-origin" viewBox="0 0 24 24">
      <path d="M5 2 L5 22" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M5 3.5 L19 6 L5 9.5 Z" fill="none" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>

    <symbol id="icon-logo-secondary" viewBox="0 0 24 24">
      <circle cx="12" cy="10" r="7" fill="none" stroke-width="1.6"/>
      <path d="M12 5.5 L13.2 8.2 L16 8.6 L14 10.7 L14.5 13.6 L12 12.1 L9.5 13.6 L10 10.7 L8 8.6 L10.8 8.2 Z" stroke-width="1"/>
      <path d="M9 16 L7.5 22 L12 19.8 L16.5 22 L15 16" fill="none" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>

    <symbol id="icon-decorative" viewBox="0 0 24 24">
      <path d="M12 3 L13.4 10.6 L21 12 L13.4 13.4 L12 21 L10.6 13.4 L3 12 L10.6 10.6 Z"/>
    </symbol>
  </defs>

  <!-- ============ BACKGROUND / FRAME / DIVIDERS ============ -->
  <rect id="bg-fill" x="0" y="0" width="127.44" height="55.44" fill="#F7F4EC"/>
  <rect id="border-frame" x="1.5" y="1.5" width="124.44" height="52.44" rx="4" ry="4"
        fill="none" stroke="#1B3A4B" stroke-width="1.2"/>
  <line id="divider-line-1" x1="42" y1="6" x2="42" y2="49.5" stroke="#D4AF37" stroke-width="0.6"/>
  <line id="divider-line-2" x1="88" y1="6" x2="88" y2="49.5" stroke="#D4AF37" stroke-width="0.6"/>

  <!-- ============ LEFT: BRANDING (x 0-42) ============ -->
  <g id="branding-group">
    <image id="branding-logo-primary" x="6" y="6" width="13" height="13"
           href="placeholder-logo.svg" xlink:href="placeholder-logo.svg"
           preserveAspectRatio="xMinYMid meet"/>

    <use id="branding-logo-secondary" href="#icon-logo-secondary" xlink:href="#icon-logo-secondary"
         x="21.5" y="7.5" width="8" height="8" fill="#B8862A" stroke="#B8862A"/>

    <text id="branding-name" x="6" y="26" font-size="5.2" font-weight="800"
          letter-spacing="0.1" fill="#1B3A4B">BRAND NAME</text>

    <text id="branding-subtitle" x="6" y="31" font-size="3.3" letter-spacing="0.3"
          fill="#20A0B0">BRAND SUBTITLE</text>

    <use id="branding-decorative-graphic" href="#icon-decorative" xlink:href="#icon-decorative"
         x="6" y="33.6" width="3.2" height="3.2" fill="#D4AF37"/>
    <text id="branding-tagline" x="10.6" y="36.6" font-size="3" letter-spacing="0.15"
          fill="#D4AF37">BRAND TAGLINE</text>
  </g>

  <!-- ============ CENTER: PRODUCT (x 42-88) ============ -->
  <g id="product-group">
    <text id="product-name" x="46" y="16.5" font-size="5" font-weight="800"
          letter-spacing="0" fill="#1B3A4B">PEPTIDE NAME</text>

    <text id="product-descriptor" x="46" y="21" font-size="2.6" letter-spacing="0.15"
          fill="#20A0B0">PRODUCT DESCRIPTOR</text>

    <text id="product-strength" x="46" y="31" font-size="9.5" font-weight="800"
          fill="#1B3A4B">00MG</text>

    <text id="product-concentration" x="46" y="36" font-size="2.9" class="mono" fill="#20A0B0">0MG/ML</text>
    <text id="product-vial-size" x="68" y="36" font-size="2.9" class="mono" fill="#20A0B0">0ML VIAL</text>

    <use id="icon-purity-use" href="#icon-purity" xlink:href="#icon-purity"
         x="46" y="38" width="3.2" height="3.2" fill="#B8862A" stroke="#B8862A"/>
    <text id="purity-claim" x="50.3" y="41" font-size="2.9" letter-spacing="0.1" fill="#20A0B0">&#8805;99% PURITY</text>

    <use id="icon-lab-tested-use" href="#icon-lab-tested" xlink:href="#icon-lab-tested"
         x="46" y="43" width="3.2" height="3.2" fill="#B8862A" stroke="#B8862A"/>
    <text id="labtested-claim" x="50.3" y="46" font-size="2.9" letter-spacing="0.1" fill="#20A0B0">LAB TESTED</text>
  </g>

  <!-- ============ RIGHT: VERIFICATION (x 88-127.44) ============ -->
  <g id="verification-group">
    <use id="verification-origin-graphic" href="#icon-origin" xlink:href="#icon-origin"
         x="91.5" y="6" width="5.6" height="5.6" fill="#B8862A" stroke="#B8862A"/>

    <image id="tracking-qr" x="97" y="8.5" width="18" height="18"
           href="placeholder-qr.svg" xlink:href="placeholder-qr.svg"
           preserveAspectRatio="xMidYMid meet"/>
    <text id="tracking-qr-caption" x="106" y="30" text-anchor="middle" font-size="2.7"
          letter-spacing="0.2" fill="#20A0B0">SCAN FOR COA</text>

    <g class="mono">
      <text id="tracking-lot-label" x="91.5" y="35.2" font-size="2.5" letter-spacing="0.2" fill="#20A0B0">LOT</text>
      <text id="tracking-lot-value" x="100.5" y="35.2" font-size="3.1" font-weight="700" fill="#1B3A4B">LOT000000</text>

      <text id="tracking-ubd-label" x="91.5" y="40" font-size="2.5" letter-spacing="0.2" fill="#20A0B0">UBD</text>
      <text id="tracking-ubd-value" x="100.5" y="40" font-size="3.1" font-weight="700" fill="#1B3A4B">MM/YYYY</text>

      <text id="tracking-coa-url" x="91" y="45.6" font-size="2" fill="#20A0B0">coa.example.com/LOT000000</text>
    </g>
  </g>

</svg>
